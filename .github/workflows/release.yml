# 推送版本标签（如 v0.3.0）时自动发布：
#   1. 检查标签和 package.json 的版本号一致，CHANGELOG 里有这个版本的说明
#   2. 打包 .vsix
#   3. 发布到 VS Code 插件商店：默认使用 Trusted Publishing（OIDC，不需要令牌，
#      需要先在插件商店的发布者设置里为本工作流创建可信发布策略）；
#      如果配置了仓库密钥 VSCE_PAT，则改用令牌发布
#   4. 发布到 Open VSX（需要仓库密钥 OVSX_PAT，没有配置时跳过）
#   5. 创建 GitHub Release，发布说明取自 CHANGELOG
#
# 某个平台发布失败时，后续平台仍会继续发布，最后整个运行标记为失败。
# 也可以在 Actions 页面手动运行，默认只打包不发布，用来测试流程。
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包、不发布（用来测试流程）
        type: boolean
        default: true

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # Trusted Publishing：向插件商店证明身份

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # 推送标签时为 false；手动运行时取决于“只打包”选项
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要完整历史来找上一个版本标签

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=codevocab-$VERSION.vsix" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION"

      - name: 检查标签与版本号一致
        if: github.ref_type == 'tag'
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json 中的版本号 ${{ steps.version.outputs.version }} 不一致。请先修改版本号再打标签。"
            exit 1
          fi

      - name: 从 CHANGELOG 提取发布说明
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 取 "## [版本号]" 到下一个 "## [" 之间的内容
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md 中没有找到 [$VERSION] 的更新说明。"
            exit 1
          fi
          {
            echo
            echo "### 安装"
            echo
            echo "- 在 VS Code 扩展面板搜索 **CodeVocab** 安装或更新"
            echo "- 或下载下方的 \`${{ steps.version.outputs.vsix }}\`，在扩展面板「…」→「从 VSIX 安装…」"
          } >> release-notes.md
          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | grep -vx "v$VERSION" | head -n 1)
          if [ -n "$PREVIOUS" ]; then
            echo >> release-notes.md
            echo "**完整变更**：https://github.com/${{ github.repository }}/compare/$PREVIOUS...v$VERSION" >> release-notes.md
          fi
          cat release-notes.md

      - name: 打包
        run: npx vsce package --out "${{ steps.version.outputs.vsix }}"

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.vsix }}
          path: ${{ steps.version.outputs.vsix }}

      - name: 发布到 VS Code 插件商店
        if: env.DRY_RUN != 'true'
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "使用仓库密钥 VSCE_PAT 发布"
            npx vsce publish --packagePath "${{ steps.version.outputs.vsix }}" --pat "$VSCE_PAT"
          else
            echo "使用 Trusted Publishing（OIDC）发布"
            npx vsce publish --packagePath "${{ steps.version.outputs.vsix }}" --oidc || {
              echo "::error::发布到 VS Code 插件商店失败。请确认已在 https://marketplace.visualstudio.com/manage 的发布者设置 → Trusted Publishing 中为仓库 ${{ github.repository }}、工作流 release.yml 创建了策略。"
              exit 1
            }
          fi

      - name: 发布到 Open VSX
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && env.OVSX_PAT != '' }}
        # Open VSX 偶尔会返回 503 等临时错误：最多尝试 3 次，间隔递增。
        # 如果服务器其实已经收到了上一次的上传，重试时会提示版本已存在，视为成功。
        run: |
          set -o pipefail # 让管道返回 ovsx 的退出码，而不是 tee 的
          for attempt in 1 2 3; do
            if npx ovsx publish "${{ steps.version.outputs.vsix }}" --pat "$OVSX_PAT" 2>&1 | tee ovsx.log; then
              exit 0
            fi
            if grep -qi "already published\|already exists" ovsx.log; then
              echo "Open VSX 上已经有这个版本，视为发布成功"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::第 $attempt 次发布到 Open VSX 失败，$((attempt * 30)) 秒后重试"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::发布到 Open VSX 失败（已重试 3 次）。可以稍后在本地运行 npx ovsx publish 手动发布。"
          exit 1

      - name: 创建 GitHub Release
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，只更新安装包"
            gh release upload "$GITHUB_REF_NAME" "${{ steps.version.outputs.vsix }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.version.outputs.vsix }}" \
              --title "CodeVocab ${{ steps.version.outputs.version }}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: 提示未配置的密钥
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && env.OVSX_PAT == '' }}
        run: echo "::warning::没有配置仓库密钥 OVSX_PAT，已跳过发布到 Open VSX。"
